# Kontrak REST API Capture Calcine.
#
# Ini menggambarkan permukaan MESIN-KE-MESIN di /api/v1 -- bukan halaman
# aplikasi, yang berkomunikasi lewat serverFn TanStack Start dan tidak punya
# kontrak HTTP yang stabil untuk didokumentasikan.
#
# Implementasinya ada di src/lib/server/api-rest.ts dan dipasang di
# src/server.ts. Berkas ini dan modul itu harus berubah bersama-sama; kalau
# salah satunya tertinggal, yang berbohong adalah berkas ini.
openapi: 3.0.3

info:
  title: Capture Calcine API
  version: "1.0.0"
  description: |
    API untuk data foto sampling calcine.

    ## Dua tingkat hak

    | Kredensial | Boleh |
    | --- | --- |
    | `X-API-Key` | **Baca saja, tanpa kecuali** |
    | `Authorization: Bearer` dari `/auth/login` | Baca **dan** kendali kamera |

    Pemisahan itu disengaja dan bukan formalitas. Kunci API adalah rahasia
    bersama yang tinggal di berkas konfigurasi sistem lain, sering tersalin ke
    skrip dan tiket -- ia tidak pernah bisa memicu rana, menulis ke folder
    jaringan, atau bertindak atas nama seseorang.

    Endpoint tulis menuntut token pengguna karena setiap capture menyimpan
    `capturedBy`, dan pertanyaan "siapa yang mengambil foto ini" harus tetap
    terjawab. Token itu juga membawa plant milik akunnya, sehingga operator
    Acid Plant tidak bisa memerintah kamera Chloride Plant lewat API -- aturan
    yang sama persis dengan yang berlaku di halaman aplikasi.

    ## Halaman dokumentasi

    Versi yang bisa diklik dan dicoba langsung ada di **`/api/v1/docs`**
    (Swagger UI), dan spesifikasi mentahnya di **`/api/v1/openapi.yaml`**.

    ## Otentikasi

    Permintaan baca membawa header `X-API-Key`. Kuncinya diambil dari variabel
    environment `API_KEYS` di app server (dipisah koma kalau lebih dari satu).

    Permintaan tulis membawa `Authorization: Bearer <token>` dari
    `POST /auth/login`. Token berlaku 12 jam.

    Kalau `API_KEYS` kosong, **seluruh API mati** dan setiap permintaan dijawab
    `503 API_DISABLED`. Itu disengaja: API yang menyala diam-diam karena
    variabelnya lupa diisi adalah kegagalan yang tidak terlihat sampai ada
    yang menemukannya.

    Beri satu kunci per konsumen. Kunci bersama tidak bisa dicabut tanpa
    memutus semua yang lain sekaligus.

    ## Waktu dan tanggal

    Dua pengertian waktu hidup berdampingan di sini, dan membedakannya penting:

    - `capturedAt` adalah **waktu sebenarnya** tombol Capture ditekan,
      dikembalikan sebagai ISO 8601 UTC.
    - `captureSession` adalah **sesi jadwal** yang dituju (`"02.00"` ...
      `"23.00"`), dan tanggal sesinya bisa berbeda dari tanggal `capturedAt`:
      sesi 23.00 sering dikerjakan setelah tengah malam, dan tetap milik hari
      sebelumnya.

    Endpoint `/sessions` mengelompokkan menurut **tanggal sesi**. Filter
    `from`/`to` di `/captures` menyaring menurut **`capturedAt`**.
  contact:
    name: Merdeka Group -- MTI Data Analytics

servers:
  # Pertama dan relatif, supaya tombol "Try it out" di halaman /api/v1/docs
  # selalu memanggil host yang sedang membuka halaman itu -- bukan alamat
  # produksi yang kebetulan tertulis di sini.
  - url: /api/v1
    description: Host yang sama dengan halaman dokumentasi ini
  - url: http://10.60.10.59:26101/api/v1
    description: Produksi (app server plant)
  - url: http://localhost:8080/api/v1
    description: Pengembangan lokal (vite dev)

security:
  - ApiKeyAuth: []

tags:
  - name: Dokumentasi
    description: Halaman Swagger UI dan spesifikasi mentah. Dua-duanya tanpa kunci.
  - name: Monitoring
    description: Kesehatan app server, folder jaringan, dan antrean kirim.
  - name: Captures
    description: Riwayat foto sampling dari registry MSSQL.
  - name: Otentikasi
    description: |
      Token pengguna. Hanya jalur ini yang boleh menulis -- kunci API
      selamanya baca-saja.
  - name: Kamera
    description: |
      Kendali kamera di lantai pabrik. Menuntut token pengguna, dan tunduk
      pada penguncian plant milik akun tersebut.
  - name: Pelaporan
    description: Angka agregat, dihitung SQL supaya dasbor tidak menarik ribuan record.
  - name: Perangkat
    description: Kamera terdaftar dan kapan masing-masing terakhir menghasilkan capture.
  - name: Reference
    description: Taksonomi plant, slot, dan jadwal sesi.

paths:
  /docs:
    get:
      tags: [Dokumentasi]
      operationId: getDocsPage
      summary: Halaman Swagger UI
      description: |
        Dokumentasi yang bisa diklik dan dicoba langsung, dibangun dari
        spesifikasi ini juga.

        **Tanpa kunci API.** Browser tidak bisa menyisipkan header `X-API-Key`
        saat membuka sebuah URL, jadi mensyaratkannya di sini berarti halaman
        ini tidak akan pernah bisa dibuka -- termasuk tombol *Authorize* di
        dalamnya, tempat kunci itu semestinya dimasukkan. Yang terbuka hanya
        bentuk API-nya; seluruh endpoint data tetap menuntut kunci.

        Tetap ikut mati kalau `API_KEYS` kosong.

        Aset Swagger UI dilayani dari app server sendiri (`/api-docs/`), bukan
        dari CDN, supaya halaman ini tetap tampil di jaringan pabrik yang tidak
        punya jalan ke internet.
      security: []
      responses:
        "200":
          description: Halaman HTML Swagger UI.
          content:
            text/html:
              schema: { type: string }
        "503":
          description: API belum diaktifkan (`API_KEYS` kosong).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /openapi.yaml:
    get:
      tags: [Dokumentasi]
      operationId: getSpec
      summary: Spesifikasi ini, mentah
      description: |
        Berkas yang sama dengan `docs/openapi.yaml` di repo -- diimpor ke dalam
        bundel server sebagai teks, jadi tidak mungkin tertinggal versi lama.

        Impor langsung ke Postman, Insomnia, atau Swagger Editor dari URL ini.
      security: []
      responses:
        "200":
          description: Spesifikasi OpenAPI dalam YAML.
          content:
            application/yaml:
              schema: { type: string }
        "503":
          description: API belum diaktifkan (`API_KEYS` kosong).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /health:
    get:
      tags: [Monitoring]
      operationId: getHealth
      summary: Kesehatan app server
      description: |
        Memeriksa tiga hal yang menentukan apakah foto bisa tersimpan:
        folder jaringan, antrean kirim, dan registry MSSQL.

        **Status kamera sengaja tidak ikut.** Canon EOS R50 tidur sendiri saat
        menganggur -- itu perilaku normal, bukan gangguan -- jadi
        memasukkannya akan membuat endpoint ini hampir selalu `degraded` dan
        sinyalnya berhenti dibaca orang.

        Pemeriksaan folder jaringan memakai `stat` + cek hak akses, **bukan**
        tulis-hapus seperti tombol probe di halaman Storage: monitoring
        memanggil ini tiap menit, dan menulis berkas percobaan sesering itu ke
        share produksi menambah beban tanpa menambah kepastian.

        Cocok dipakai sebagai check Zabbix/Nagios/uptime: `200` sehat,
        `503` ada yang bermasalah.
      responses:
        "200":
          description: Semua pemeriksaan lolos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: |
            Ada pemeriksaan yang gagal (`status: "degraded"`), atau API belum
            diaktifkan (`API_DISABLED`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Health"
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /plants:
    get:
      tags: [Reference]
      operationId: listPlants
      summary: Daftar plant, slot, dan jadwal sesi
      description: |
        Taksonomi tetap yang dipakai seluruh aplikasi. Berguna untuk konsumen
        yang membangun tampilan sendiri dan tidak mau menuliskan ulang nama
        plant atau jam sesi.

        Perhatikan sebutan slot berbeda per plant: Acid Plant menyebutnya
        **TRAIN**, plant lain menyebutnya **BIN**. Itu istilah lapangan
        masing-masing, bukan sinonim yang boleh dipertukarkan.
      responses:
        "200":
          description: Taksonomi plant dan sesi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /captures:
    get:
      tags: [Captures]
      operationId: listCaptures
      summary: Riwayat capture, terbaru dulu
      description: |
        Diurutkan `capturedAt` menurun. Penyaringan dan paginasi dilakukan di
        SQL Server, jadi `pagination.total` menghitung seluruh baris yang cocok
        dengan filter, bukan hanya yang ada di halaman ini.
      parameters:
        - name: plant
          in: query
          description: Nama plant persis, mis. `Acid Plant`.
          schema: { $ref: "#/components/schemas/PlantName" }
        - name: session
          in: query
          description: Label sesi persis, mis. `14.00`.
          schema: { $ref: "#/components/schemas/SessionLabel" }
        - name: status
          in: query
          description: |
            Status simpan. `pending` berarti berkasnya masih di antrean app
            server dan **belum** sampai di folder jaringan.
          schema: { $ref: "#/components/schemas/CaptureStatus" }
        - name: from
          in: query
          description: |
            Batas bawah `capturedAt`, **inklusif**. Terima `YYYY-MM-DD` atau
            ISO 8601 penuh. Tanggal telanjang dibaca sebagai hari **UTC**;
            kirim ISO berikut offset (`2026-08-27T00:00:00+08:00`) kalau yang
            dimaksud hari waktu setempat.
          schema: { type: string, example: "2026-08-27" }
        - name: to
          in: query
          description: |
            Batas atas `capturedAt`, **eksklusif**. Tanggal telanjang digeser
            ke awal hari berikutnya, jadi `from=X&to=X` berarti sepanjang hari
            X.
          schema: { type: string, example: "2026-08-27" }
        - name: limit
          in: query
          description: Jumlah baris per halaman. Dibatasi maksimum 500.
          schema: { type: integer, minimum: 1, maximum: 500, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Satu halaman record capture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CapturesPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /captures/{id}:
    get:
      tags: [Captures]
      operationId: getCapture
      summary: Satu record capture
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Record capture.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Tidak ada record dengan id itu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /captures/{id}/image:
    get:
      tags: [Captures]
      operationId: getCaptureImage
      summary: Berkas foto asli sebuah capture
      description: |
        Mengembalikan **berkasnya sendiri**, bukan metadatanya -- dibaca dari
        folder jaringan tempat capture itu tersimpan.

        Ukurannya penuh, sekitar 11 MB per foto, dan ditarik lewat CIFS. Jangan
        dipakai untuk menyusun galeri: ambil daftarnya dari `/captures` lalu
        minta berkas ini hanya untuk foto yang memang perlu dilihat.

        Path berkas diverifikasi berada di bawah folder jaringan yang dikelola
        app sebelum apa pun dibaca dari disk, jadi `file_path` yang aneh di
        registry tidak bisa dipakai membaca berkas lain di server.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Berkas foto.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Path berkasnya di luar folder jaringan yang dikelola app.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            Record tidak ada, atau berkasnya belum mendarat di folder jaringan
            (`FILE_NOT_READY` -- capture yang masih mengantre di app server).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /sessions:
    get:
      tags: [Captures]
      operationId: getSessionCoverage
      summary: Cakupan 8 sesi x 2 slot untuk satu tanggal
      description: |
        Menjawab pertanyaan yang sebenarnya dipakai orang: **sampling sesi mana
        yang terlewat hari ini?**

        Dikelompokkan menurut **tanggal sesi**, bukan tanggal jam dinding.
        Tanggal sesi dibaca dari segmen `YYYY/MM/DD` pada path berkas, yang
        ditulis saat berkas dinamai dan karenanya tidak membawa zona waktu
        apa pun. Untuk record lama yang path-nya tidak memuat tanggal, tanggal
        sesi dihitung dari `capturedAt` dengan memilih hari yang membuat sesi
        itu paling dekat dengan waktu capture -- itu yang menempatkan capture
        pukul 00.30 pada sesi 23.00 hari sebelumnya.

        Kalau satu slot punya beberapa percobaan capture, yang dikembalikan
        **yang terbaru**: capture ulang menimpa berkas di share, jadi tulisan
        terakhirlah yang menggambarkan berkas yang benar-benar ada di sana.
      parameters:
        - name: date
          in: query
          description: Tanggal sesi `YYYY-MM-DD`. Bawaan hari ini menurut jam app server.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$', example: "2026-08-27" }
        - name: plant
          in: query
          description: Batasi ke satu plant. Bawaan semua plant.
          schema: { $ref: "#/components/schemas/PlantName" }
      responses:
        "200":
          description: Cakupan sesi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionCoverage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /summary:
    get:
      tags: [Pelaporan]
      operationId: getSummary
      summary: Angka ringkas untuk dasbor
      description: |
        Hitungan agregat yang dikerjakan SQL, supaya dasbor tidak perlu menarik
        ribuan record hanya untuk menghitung satu bilangan.

        **Perhatikan `timezone` pada jawabannya.** Jendela `today`, `last7Days`,
        dan `last30Days` dihitung memakai jam app server, dan zonanya disebut
        di sana. Ini bukan detail sepele: sesi 02.00 WITA jatuh pada hari
        sebelumnya kalau dihitung dengan UTC.
      responses:
        "200":
          description: Ringkasan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /devices:
    get:
      tags: [Perangkat]
      operationId: listDevices
      summary: Kamera terdaftar dan kapan terakhir menghasilkan capture
      description: |
        Daftar kamera beserta penempatannya, ditambah `lastCapturedAt` dan
        `captureCount` per kamera -- dua kolom yang membuat endpoint ini
        berguna untuk monitoring: kamera yang terdaftar tapi diam berhari-hari
        adalah persoalan, dan tanpa angka itu tidak ada yang bisa melihatnya
        dari luar.

        Alamat jaringan (`edge_api_url`, `ip_address`) dan catatan internal
        **tidak** disertakan: itu peta jaringan pabrik, dan kunci API baca-saja
        bukan tempatnya.
      responses:
        "200":
          description: Daftar perangkat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /auth/login:
    post:
      tags: [Otentikasi]
      operationId: login
      summary: Tukar username/password dengan access token + refresh token
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier:
                  type: string
                  description: Username atau email.
                  example: operator.ap
                password: { type: string, format: password }
      responses:
        "200":
          description: Access token 12 jam dan refresh token 30 hari diterbitkan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            Username atau password salah. Pesannya sengaja tidak membedakan
            keduanya -- membedakannya memberi tahu penebak bahwa sebuah akun
            memang ada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Akun dinonaktifkan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /auth/refresh:
    post:
      tags: [Otentikasi]
      operationId: refresh
      summary: Tukar refresh token dengan pasangan token baru
      description: |
        Dipakai klien mobile untuk mempertahankan sesi jangka panjang tanpa
        meminta operator login ulang setiap access token 12 jam habis.

        Refresh token dirotasi setiap kali dipakai: token lama mati, token
        baru terbit bersama access token baru.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Pasangan token baru diterbitkan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Refresh token tidak sah, kedaluwarsa, dicabut, atau akun sudah nonaktif.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /auth/me:
    get:
      tags: [Otentikasi]
      operationId: getMe
      summary: Identitas pemegang token
      description: |
        Datanya dibaca **ulang dari database**, bukan diambil dari klaim di
        dalam token: peran bisa diturunkan dan akun bisa dinonaktifkan setelah
        token terbit, dan token yang masih berlaku tidak boleh membuat
        perubahan itu tak terlihat.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Identitas dan masa berlaku token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          description: Token tidak sah, kedaluwarsa, dicabut, atau akun dinonaktifkan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/UserTokenRequired" }

  /auth/logout:
    post:
      tags: [Otentikasi]
      operationId: logout
      summary: Cabut token yang sedang dipakai
      description: |
        Mencabut **token ini saja**; token lain milik akun yang sama tetap
        hidup.

        Daftar cabutan disimpan di memori proses, jadi ia hilang saat container
        di-restart -- token yang dicabut bisa hidup lagi sampai kedaluwarsa
        sendiri dalam 12 jam. Pencabutan yang pasti dan bertahan melewati
        restart dilakukan dengan menonaktifkan akunnya.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: |
                    Opsional. Jika dikirim, refresh token milik sesi mobile ini
                    ikut dicabut sehingga app tidak bisa memperbarui access
                    token lagi.
      responses:
        "200":
          description: Token dicabut.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  revokedAt: { type: string, format: date-time }
        "403": { $ref: "#/components/responses/UserTokenRequired" }

  /devices/{code}/status:
    get:
      tags: [Perangkat]
      operationId: getDeviceStatus
      summary: Status langsung kamera dari edge
      description: |
        Ditanyakan langsung ke service kamera di area plant, bukan dibaca dari
        registry -- jadi jawabannya menggambarkan keadaan saat ini, termasuk
        saat kameranya tercabut atau tertidur.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string, example: edge-camera-01 }
      responses:
        "200":
          description: Status perangkat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Device tidak ada di registry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/EdgeUnavailable" }
        "503": { $ref: "#/components/responses/DatabaseUnavailable" }

  /jobs/{jobId}:
    get:
      tags: [Kamera]
      operationId: getJob
      summary: Status job capture atau autofocus
      description: |
        `POST /camera/capture` dan `/camera/autofocus` menjawab **job**, bukan
        hasil. Endpoint ini yang menungguinya sampai `succeeded` atau `failed`.

        Sebabnya fisik: capture Canon butuh beberapa detik, dan menahan koneksi
        HTTP selama itu membuat klien yang timeout menyangka capture-nya gagal
        padahal rananya sudah terlanjur jatuh.
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Status job.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Job tidak dikenal edge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/EdgeUnavailable" }

  /camera/session:
    post:
      tags: [Kamera]
      operationId: createCameraSession
      summary: Ambil sewa eksklusif atas kamera
      description: |
        **Wajib dilakukan lebih dulu** sebelum capture atau autofocus. Kamera
        Canon mengunci sesinya: dua pemanggil yang memotret bersamaan
        menghasilkan `PTP Device Busy`, dan sewa inilah yang mencegahnya.

        `ownerId` diambil dari token, **bukan** dari badan permintaan -- kalau
        klien boleh menyebutkannya sendiri, sesi kamera bisa diklaim atas nama
        orang lain.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                leaseSeconds:
                  type: integer
                  default: 120
                  description: Lama sewa. Habis sendiri kalau tidak dilepas.
                deviceId:
                  type: integer
                  description: |
                    Wajib hanya kalau ada lebih dari satu kamera aktif yang
                    boleh diakses akun ini. Dengan satu kandidat, resolver
                    memilihkannya; dengan dua, ia menolak menebak.
      responses:
        "200":
          description: Sewa diberikan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CameraSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/UserTokenRequired" }
        "409":
          description: |
            Kamera sedang dipakai client lain, atau pilihan device ambigu.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502": { $ref: "#/components/responses/EdgeUnavailable" }

  /camera/capture:
    post:
      tags: [Kamera]
      operationId: triggerCapture
      summary: Picu rana kamera
      description: |
        **Menjatuhkan rana kamera sungguhan di lantai pabrik.**

        Menjawab `202` dengan sebuah job; tunggui lewat `GET /jobs/{jobId}`.
        Berkasnya diturunkan ke edge, lalu ditarik dan disimpan aplikasi ke
        folder jaringan dengan penamaan sesi yang berlaku.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken]
              properties:
                leaseToken:
                  type: string
                  description: Dari `POST /camera/session`.
                deviceId: { type: integer }
      responses:
        "202":
          description: Job dibuat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/UserTokenRequired" }
        "502": { $ref: "#/components/responses/EdgeUnavailable" }

  /camera/autofocus:
    post:
      tags: [Kamera]
      operationId: triggerAutofocus
      summary: Jalankan autofocus
      description: |
        Bentuk jawabannya sama dengan capture -- sebuah job yang ditunggui
        lewat `GET /jobs/{jobId}` -- tetapi hasilnya tidak menghasilkan berkas
        apa pun.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaseToken]
              properties:
                leaseToken: { type: string }
                deviceId: { type: integer }
      responses:
        "202":
          description: Job dibuat.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JobAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/UserTokenRequired" }
        "502": { $ref: "#/components/responses/EdgeUnavailable" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        Kunci statis dari `API_KEYS` di environment app server.

        Sengaja bukan `Authorization: Bearer`: skema Bearer menyiratkan token
        berumur pendek yang bisa disegarkan, sementara ini kunci statis yang
        dicabut dengan mengeluarkannya dari `API_KEYS`.

        **Baca-saja, tanpa kecuali.** Kunci ini tidak pernah bisa memicu rana,
        menulis ke folder jaringan, atau bertindak atas nama seseorang. Kunci
        yang bocor bisa membaca riwayat sampling -- tidak lebih.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Token pengguna dari `POST /auth/login`, berlaku 12 jam.

        **Wajib untuk semua endpoint tulis.** Alasannya bukan formalitas:
        setiap capture menyimpan `capturedBy`, dan pertanyaan "siapa yang
        mengambil foto ini" harus tetap terjawab. Kunci API tidak punya orang
        di belakangnya; token ini punya.

        Ia juga membawa plant milik akunnya, sehingga operator Acid Plant tidak
        bisa memerintah kamera Chloride Plant lewat API -- aturan yang sama
        persis dengan yang berlaku di halaman aplikasi.

        Untuk sesi mobile jangka panjang, access token ini dipasangkan dengan
        refresh token dari `POST /auth/login` dan `POST /auth/refresh`.

        Dicabut lewat `POST /auth/logout`, atau seketika dan permanen dengan
        menonaktifkan akunnya (diperiksa ulang dari database di `/auth/me`).

  responses:
    UserTokenRequired:
      description: |
        Endpoint ini menuntut token pengguna; kunci API ditolak. Ini batas
        baca/tulis API-nya, bukan kekeliruan konfigurasi.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    EdgeUnavailable:
      description: |
        Service kamera di area plant tidak terjangkau atau menolak permintaan.
        App server sendiri sehat -- yang diam adalah mesin di sisi kamera.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Parameter tidak sah.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: |
        Header `X-API-Key` tidak ada atau tidak dikenali.
      headers:
        WWW-Authenticate:
          schema: { type: string }
          example: 'ApiKey header="x-api-key"'
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    DatabaseUnavailable:
      description: Registry MSSQL belum dikonfigurasi di app server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    LoginResponse:
      type: object
      required: [token, tokenType, expiresAt, refreshToken, refreshExpiresAt, user]
      properties:
        token: { type: string }
        tokenType: { type: string, example: Bearer }
        expiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshExpiresAt: { type: string, format: date-time }
        user:
          allOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: object
              properties:
                plant:
                  type: string
                  nullable: true

    SessionUser:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        fullName: { type: string }
        email: { type: string, nullable: true }
        role: { type: string, example: operator }

    MeResponse:
      type: object
      properties:
        user:
          allOf:
            - $ref: "#/components/schemas/SessionUser"
            - type: object
              properties:
                plant:
                  type: string
                  nullable: true
                  description: |
                    Plant yang boleh diakses akun ini. `ALL` berarti tidak
                    dibatasi. Nilai inilah yang mengunci kamera mana yang boleh
                    diperintah lewat endpoint /camera.
        token:
          type: object
          properties:
            issuedAt: { type: string, format: date-time }
            expiresAt: { type: string, format: date-time }

    DeviceStatus:
      type: object
      properties:
        deviceCode: { type: string }
        deviceName: { type: string, nullable: true }
        plant: { type: string, nullable: true }
        edge:
          type: object
          description: Jawaban mentah dari service kamera, diteruskan apa adanya.
          additionalProperties: true

    CameraSession:
      type: object
      properties:
        deviceCode: { type: string, nullable: true }
        plant: { type: string, nullable: true }
        ownerId:
          type: string
          description: Diambil dari token, bukan dari badan permintaan.
        session:
          type: object
          properties:
            sessionId: { type: string }
            leaseToken:
              type: string
              description: Dibawa di setiap perintah kamera berikutnya.
            expiresAt: { type: string, format: date-time }

    JobAccepted:
      type: object
      properties:
        deviceCode: { type: string, nullable: true }
        job: { $ref: "#/components/schemas/Job" }

    Job:
      type: object
      properties:
        jobId: { type: string }
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        result:
          type: object
          additionalProperties: true
        error:
          type: object
          nullable: true
          properties:
            code: { type: string }
            message: { type: string }

    Summary:
      type: object
      required: [generatedAt, timezone, totals, windows, byStatus, byPlant]
      properties:
        generatedAt: { type: string, format: date-time }
        timezone:
          type: string
          description: Zona waktu app server, penentu batas hari pada `windows`.
          example: Asia/Makassar
        totals:
          type: object
          properties:
            captures: { type: integer, example: 1284 }
            bytes: { type: integer, format: int64, example: 14126391296 }
            lastCapturedAt: { type: string, format: date-time, nullable: true }
        windows:
          type: object
          properties:
            today: { type: integer, example: 12 }
            last7Days: { type: integer, example: 96 }
            last30Days: { type: integer, example: 412 }
        byStatus:
          type: object
          description: |
            `other` dihitung sebagai sisa, bukan didaftar satu per satu, supaya
            status baru yang muncul kemudian tetap masuk jumlah totalnya.
          properties:
            saved: { type: integer }
            downloaded: { type: integer }
            other: { type: integer }
        byPlant:
          type: array
          items:
            type: object
            properties:
              plant: { type: string, nullable: true }
              captures: { type: integer }
              bytes: { type: integer, format: int64 }
              lastCapturedAt: { type: string, format: date-time, nullable: true }

    DeviceList:
      type: object
      required: [total, devices]
      properties:
        total: { type: integer }
        devices:
          type: array
          items: { $ref: "#/components/schemas/Device" }

    Device:
      type: object
      required: [code, isActive, captureCount]
      properties:
        code: { type: string, example: CAM-AP-01 }
        name: { type: string, nullable: true }
        cameraModel: { type: string, nullable: true, example: Canon EOS R50 }
        connectionType: { type: string, nullable: true }
        isActive: { type: boolean }
        plant: { type: string, nullable: true }
        station: { type: string, nullable: true }
        bin: { type: string, nullable: true }
        captureCount:
          type: integer
          description: Jumlah capture yang pernah dihasilkan kamera ini.
        lastCapturedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Kosong berarti kamera terdaftar tapi belum pernah menghasilkan
            capture sama sekali.
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Kode stabil untuk dicocokkan program. Pesannya boleh berubah,
                kodenya tidak.
              enum:
                - API_DISABLED
                - INVALID_API_KEY
                - INVALID_PARAM
                - NOT_FOUND
                - METHOD_NOT_ALLOWED
                - CARDDB_NOT_CONFIGURED
                - INTERNAL_ERROR
            message:
              type: string
              description: |
                Penjelasan untuk manusia, berbahasa Indonesia. Detail teknis
                kegagalan internal sengaja TIDAK disertakan di sini -- pesan
                MSSQL memuat nama server dan potongan query, dan itu hanya
                masuk ke log app server.
      example:
        error:
          code: INVALID_PARAM
          message: "limit harus bilangan bulat >= 1"

    PlantName:
      type: string
      enum:
        - Acid Plant
        - Chloride Plant
        - Pyrite Plant
        - Copper Cathode Plant

    SessionLabel:
      type: string
      description: Delapan sesi per hari, berjarak tetap tiga jam.
      enum: ["02.00", "05.00", "08.00", "11.00", "14.00", "17.00", "20.00", "23.00"]

    CaptureStatus:
      type: string
      enum: [saved, pending, downloaded]
      description: |
        - `saved` -- berkasnya sudah ada di folder jaringan.
        - `pending` -- masih di antrean app server, belum sampai di share.
        - `downloaded` -- diunduh lewat browser operator, tidak lewat share.

    SaveMethod:
      type: string
      nullable: true
      enum: [app-network, spooled, edge-network, browser-folder, browser-download]
      description: |
        Jalur yang dipakai menyimpan berkas.

        - `app-network` -- ditulis app server ke folder jaringan. Jalur normal.
        - `spooled` -- masih menunggu di antrean app server.
        - `edge-network` -- ditulis oleh edge API (skema lama, sebelum
          penyimpanan dipindahkan ke app server).
        - `browser-folder` / `browser-download` -- cadangan lewat browser
          operator ketika app server tidak bisa menyimpan sama sekali.

        `null` untuk record lama yang metadatanya belum memuat medan ini.

    CaptureRecord:
      type: object
      required: [id, fileName, filePath, capturedAt, status, createdAt]
      properties:
        id: { type: integer, format: int64 }
        deviceCode: { type: string, nullable: true, example: EDGE-CAMERA-01 }
        deviceName: { type: string, nullable: true }
        plant: { allOf: [{ $ref: "#/components/schemas/PlantName" }], nullable: true }
        captureBin:
          type: string
          nullable: true
          description: Label slot sebagaimana disimpan, mis. `TRAIN 1` atau `BIN 2`.
          example: TRAIN 1
        captureSession:
          allOf: [{ $ref: "#/components/schemas/SessionLabel" }]
          nullable: true
          description: |
            `null` untuk record dari sebelum skema sesi dipakai -- bukan
            kelalaian, dan halaman Gallery pun menampilkannya sebagai "—".
        capturedBy:
          type: string
          nullable: true
          description: |
            Nama operator yang menekan Capture. Dibaca server dari cookie
            sesi, tidak pernah dari payload klien, jadi tidak bisa dipalsukan.
            `null` untuk record dari sebelum atribusi dipasang.
        station: { type: string, nullable: true }
        fileName: { type: string, example: "14.00 Train 1.jpg" }
        filePath:
          type: string
          description: |
            Path tujuan di folder jaringan. Untuk record `pending`, ini masih
            path yang DITUJU -- berkasnya sendiri belum ada di sana.
          example: /mnt/mti/ML/MTI/Calcine Project/Calcine Sample Foto/Foto Sampling/Acid Plant/2026/08/27/14.00 Train 1.jpg
        capturedAt:
          type: string
          format: date-time
          description: Waktu sebenarnya tombol Capture ditekan, UTC.
        status: { $ref: "#/components/schemas/CaptureStatus" }
        fileSizeBytes: { type: integer, format: int64, nullable: true }
        checksumSha256: { type: string, nullable: true }
        saveMethod: { $ref: "#/components/schemas/SaveMethod" }
        assetId: { type: string, nullable: true, description: Id media di edge API. }
        createdAt:
          type: string
          format: date-time
          description: Kapan barisnya masuk registry. Bisa lebih lambat dari `capturedAt`.

    Pagination:
      type: object
      required: [limit, offset, total, hasMore]
      properties:
        limit: { type: integer }
        offset: { type: integer }
        total:
          type: integer
          description: Seluruh baris yang cocok dengan filter, bukan hanya halaman ini.
        hasMore: { type: boolean }

    CapturesPage:
      type: object
      required: [items, pagination]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CaptureRecord" }
        pagination: { $ref: "#/components/schemas/Pagination" }

    Health:
      type: object
      required: [status, checkedAt, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: "`degraded` kalau ada satu saja pemeriksaan yang gagal."
        checkedAt: { type: string, format: date-time }
        checks:
          type: object
          required: [networkShare, spool, database]
          properties:
            networkShare:
              type: object
              description: Folder jaringan tujuan akhir (`NETWORK_SAVE_ROOT`).
              properties:
                ok: { type: boolean }
                configured: { type: boolean }
                targetRoot: { type: string, nullable: true }
                code:
                  type: string
                  nullable: true
                  description: |
                    `null` saat sehat. `NOT_CONFIGURED`, `NOT_DIRECTORY`,
                    `TIMEOUT`, atau kode errno seperti `ENOENT` / `EACCES`.
                message: { type: string }
            spool:
              type: object
              description: |
                Antrean kirim di app server. **Antrean yang berisi bukan
                kegagalan** -- itu justru rancangannya bekerja. Yang membuat
                `ok: false` adalah kapasitas hampir habis (>90%), sebab di
                titik itu capture berikutnya akan ditolak.
              properties:
                ok: { type: boolean }
                configured: { type: boolean }
                writable:
                  type: boolean
                  description: |
                    Izin tulis sungguhan, bukan sekadar "foldernya ada".
                    `false` berarti **setiap capture akan gagal** menulis
                    antrean dan jatuh ke unduhan browser -- biasanya karena
                    named volume Docker terbuat milik root sementara container
                    jalan sebagai `node`.
                pending: { type: integer, description: Jumlah foto yang menunggu. }
                bytes: { type: integer, format: int64 }
                capBytes: { type: integer, format: int64 }
                usedPercent: { type: integer }
                oldestQueuedAt:
                  type: string
                  format: date-time
                  nullable: true
                  description: |
                    Sejak kapan foto tertua menunggu. Nilai yang terus menua
                    berarti folder jaringan sudah lama tidak terjangkau.
            database:
              type: object
              description: Registry MSSQL (`capture_records`).
              properties:
                ok: { type: boolean }
                configured: { type: boolean }
                code: { type: string, nullable: true }
                message: { type: string }
      example:
        status: degraded
        checkedAt: "2026-08-27T09:12:00.000Z"
        checks:
          networkShare:
            ok: false
            configured: true
            targetRoot: /mnt/mti/ML/MTI/Calcine Project/Calcine Sample Foto/Foto Sampling
            code: ENOENT
            message: "ENOENT: no such file or directory"
          spool:
            ok: true
            configured: true
            pending: 6
            bytes: 31457280
            capBytes: 2147483648
            usedPercent: 1
            oldestQueuedAt: "2026-08-27T06:05:11.000Z"
          database: { ok: true, configured: true, code: null }

    PlantsResponse:
      type: object
      required: [plants, sessions]
      properties:
        plants:
          type: array
          items:
            type: object
            properties:
              name: { $ref: "#/components/schemas/PlantName" }
              code: { type: string, description: Kode dua huruf untuk nama berkas., example: AP }
              slots:
                type: array
                items:
                  type: object
                  properties:
                    slot: { type: integer, enum: [1, 2] }
                    label: { type: string, example: TRAIN 1 }
                    title:
                      type: string
                      description: Bentuk berkapital judul yang dipakai di nama berkas.
                      example: Train 1
        sessions:
          type: array
          items:
            type: object
            properties:
              hour: { type: integer, example: 14 }
              label: { $ref: "#/components/schemas/SessionLabel" }

    CoverageSummary:
      type: object
      required: [expected, captured, missing]
      properties:
        expected: { type: integer, description: 8 sesi x 2 slot per plant. }
        captured: { type: integer }
        missing: { type: integer }

    SessionCoverage:
      type: object
      required: [date, plants, summary]
      properties:
        date: { type: string, example: "2026-08-27" }
        plants:
          type: array
          items:
            type: object
            required: [plant, sessions, summary]
            properties:
              plant: { $ref: "#/components/schemas/PlantName" }
              sessions:
                type: array
                items:
                  type: object
                  properties:
                    session: { $ref: "#/components/schemas/SessionLabel" }
                    hour: { type: integer }
                    slots:
                      type: array
                      items:
                        type: object
                        properties:
                          slot: { type: integer, enum: [1, 2] }
                          label: { type: string, example: Train 1 }
                          captured: { type: boolean }
                          record:
                            allOf: [{ $ref: "#/components/schemas/CaptureRecord" }]
                            nullable: true
              summary: { $ref: "#/components/schemas/CoverageSummary" }
        summary:
          allOf: [{ $ref: "#/components/schemas/CoverageSummary" }]
          description: Jumlah seluruh plant yang diminta.
