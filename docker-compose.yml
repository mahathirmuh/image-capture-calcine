services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: image-capture-calcine:latest
    container_name: image-capture-calcine
    restart: unless-stopped
    ports:
      # host:container -- browse the app at http://<this-host>:26101
      # 8080 is already taken on the production host by nginx-proxy-manager,
      # which fronts most other apps there -- pick a free host port and put
      # this behind a Proxy Host entry in NPM instead of exposing it directly.
      - "26101:3000"
    environment:
      # The Camera Control edge API running natively on the Mini PC next to the
      # camera. It is NOT containerised: gphoto2 needs direct USB access to the
      # Canon, which Docker on Windows cannot reliably pass through.
      #
      # This must be an address the CONTAINER can reach. localhost/127.0.0.1
      # would resolve to the container itself, so a real LAN IP is required.
      CAMERA_API_URL: ${CAMERA_API_URL:-http://10.60.20.196:3000}
      # Optional bearer token; leave unset if the edge API needs no auth.
      CAMERA_API_TOKEN: ${CAMERA_API_TOKEN:-}
      # Where captures land. Read INSIDE the container, so it must be a path
      # the container can see -- i.e. the mount below, not a UNC path and not
      # a path that only exists on the edge device.
      NETWORK_SAVE_ROOT: ${NETWORK_SAVE_ROOT:-/mnt/mti/ML/MTI/Calcine Project/Calcine Sample Foto/Foto Sampling}
      # Antrean kirim. Setiap capture ditulis ke sini lebih dulu, lalu
      # diteruskan ke NETWORK_SAVE_ROOT. Dipetakan ke named volume di bawah
      # supaya antreannya BERTAHAN melewati `docker compose up -d --build` --
      # kalau ia tinggal di lapisan container, deploy akan menghapus foto yang
      # belum sempat terkirim.
      CAPTURE_SPOOL_DIR: ${CAPTURE_SPOOL_DIR:-/var/lib/capture-spool}
      # Saat terlampaui, capture ditolak dengan pesan jelas -- bukan membuang
      # entri terlama.
      CAPTURE_SPOOL_MAX_MB: ${CAPTURE_SPOOL_MAX_MB:-2048}
      # Kunci REST API baca-saja di /api/v1 (kontraknya di docs/openapi.yaml),
      # dipisah koma kalau lebih dari satu.
      #
      # SENGAJA TANPA NILAI BAWAAN. Kosong berarti API mati dan setiap
      # permintaan dijawab 503 -- itu keadaan yang benar sampai ada konsumen
      # yang memang membutuhkannya. Nilai bawaan di sini akan berarti setiap
      # deployment menyalakan API dengan kunci yang sama dan sudah publik.
      API_KEYS: ${API_KEYS:-}
    # Reads CAMERA_API_URL/CAMERA_API_TOKEN/NETWORK_SAVE_ROOT from a local .env
    # if present, otherwise the defaults above apply.
    env_file:
      - path: .env
        required: false
    volumes:
      # \\10.1.1.44\Data Analytics, mounted over CIFS on the HOST first (see
      # scripts/mount-network-share.sh) and passed straight through here.
      #
      # Mount it on the host with uid=1000,gid=1000: CIFS fixes ownership at
      # mount time, and 1000 is the `node` user this image runs as (see the
      # Dockerfile's USER line). Any other uid and the container gets a
      # read-only view of a share it is nominally allowed to write.
      #
      # propagation: rslave is what makes this survive the share going away and
      # coming back. A default bind is resolved once, at container start: if
      # /mnt/mti is remounted on the host afterwards, the container keeps
      # looking at the old, now-empty directory and auto-save stays dead until
      # someone restarts the container by hand. rslave subscribes the container
      # to the host's mount events, so a remount shows up inside a running
      # container. "slave" not "shared" on purpose -- events travel host to
      # container only, and nothing the container does can alter host mounts.
      #
      # It needs the host side to have shared propagation. systemd makes / an
      # rshared mount at boot, so a fstab mount under /mnt normally inherits it;
      # the setup script asserts it anyway with `mount --make-rshared`, because
      # when the assumption does not hold Docker refuses to start the container
      # rather than quietly falling back.
      #
      # Docker still creates an empty directory for a missing bind source
      # instead of refusing, so an unreachable share at start time is caught by
      # `saveMediaToNetwork` refusing to write into a NETWORK_SAVE_ROOT that
      # is not there -- captures fall back to a browser download rather than
      # piling up on the container's own disk.
      - type: bind
        source: /mnt/mti
        target: /mnt/mti
        bind:
          propagation: rslave
      # Antrean kirim. Named volume, bukan bind: isinya murni milik aplikasi
      # dan tidak perlu dibaca dari host, tapi harus selamat dari rebuild.
      - capture-spool:/var/lib/capture-spool

volumes:
  # Dikelola Docker. `docker compose down` biasa TIDAK menghapusnya; hanya
  # `down -v` yang melakukannya -- dan itu berarti membuang foto yang belum
  # terkirim, jadi jangan dipakai selama antreannya belum kosong.
  capture-spool:
